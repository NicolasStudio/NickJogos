<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320" role="img" aria-label="Global Outbreak">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#15263a"/>
      <stop offset="100%" stop-color="#0B1118"/>
    </radialGradient>
    <radialGradient id="hot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D94848" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#E4B44E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E4B44E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8EEF4"/>
      <stop offset="100%" stop-color="#4D8FD0"/>
    </linearGradient>
  </defs>

  <rect width="500" height="320" fill="url(#bg)"/>

  <!-- grade de longitude/latitude discreta -->
  <g stroke="#293746" stroke-width="0.6" opacity="0.5">
    <path d="M0 110 H500 M0 160 H500 M0 210 H500" fill="none"/>
    <path d="M110 70 V260 M250 70 V260 M390 70 V260" fill="none"/>
  </g>

  <!-- continentes estilizados (blobs) -->
  <g fill="#1f3047">
    <path d="M70 120 q25 -30 60 -22 q35 8 30 35 q-5 28 -40 40 q-40 12 -55 -15 q-12 -22 5 -38 z" fill="#1f3047"/>
    <path d="M150 180 q10 -14 28 -8 q22 10 15 42 q-8 36 -30 44 q-18 6 -22 -22 q-5 -40 9 -56 z" fill="#1f3047"/>
    <path d="M235 110 q30 -26 66 -16 q30 10 20 34 q-10 24 -48 30 q-40 6 -46 -18 q-5 -18 8 -30 z" fill="#1f3047"/>
    <path d="M300 170 q24 -18 46 -6 q18 12 8 40 q-12 30 -40 30 q-22 0 -24 -28 q-2 -24 10 -36 z" fill="#1f3047"/>
    <path d="M360 100 q40 -18 80 -4 q26 12 14 34 q-14 24 -58 26 q-44 2 -50 -20 q-4 -24 14 -36 z" fill="#1f3047"/>
    <path d="M395 205 q20 -12 38 -2 q14 10 6 30 q-10 22 -34 20 q-18 -2 -18 -24 q0 -16 8 -24 z" fill="#1f3047"/>
  </g>

  <!-- focos de contaminacao -->
  <g>
    <circle cx="115" cy="150" r="42" fill="url(#hot)"/>
    <circle cx="300" cy="135" r="52" fill="url(#hot)"/>
    <circle cx="410" cy="125" r="38" fill="url(#hot)"/>
    <circle cx="180" cy="210" r="30" fill="url(#hot)"/>
    <circle cx="115" cy="150" r="5" fill="#D94848"/>
    <circle cx="300" cy="135" r="5" fill="#D94848"/>
    <circle cx="410" cy="125" r="4" fill="#E4B44E"/>
    <circle cx="180" cy="210" r="4" fill="#E4B44E"/>
  </g>

  <!-- rotas pontilhadas -->
  <g stroke="#4D8FD0" stroke-width="1.2" fill="none" opacity="0.7" stroke-dasharray="3 4">
    <path d="M115 150 Q210 90 300 135"/>
    <path d="M300 135 Q360 110 410 125"/>
    <path d="M115 150 Q150 185 180 210"/>
  </g>

  <!-- faixa do titulo -->
  <rect x="0" y="252" width="500" height="68" fill="#0B1118" opacity="0.82"/>
  <text x="26" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="2" fill="url(#title)">GLOBAL OUTBREAK</text>
  <text x="27" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#91A0AE" letter-spacing="3">CENTRO DE MONITORAMENTO - ESTRATEGIA</text>
</svg>
