<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Inimigos</title>
<style>
    :root {
        --bg: #0f1730; --panel: #16213f; --line: #2a3a66; --text: #e8eeff; --muted: #9fb0d8;
        --accent: #ffd23f; --zero: #ff6b6b; --cell: #24477f; --cell-hi: #3d7be0; --boss: #a46bff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
    main { max-width: 1200px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 24px; }
    .sub { margin: 0 0 20px; color: var(--muted); }
    .cards { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; min-width: 150px; }
    .card b { display: block; font-size: 26px; color: var(--accent); }
    .card span { color: var(--muted); font-size: 13px; }
    .card.alert b { color: var(--zero); }
    h2 { font-size: 17px; margin: 28px 0 10px; }
    .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
    table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
    th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
    th { background: #1c2a52; font-weight: 600; position: sticky; top: 0; }
    th.world { border-left: 2px solid var(--accent); }
    td:first-child, th:first-child { text-align: left; position: sticky; left: 0; background: var(--panel); z-index: 1; }
    th:first-child { background: #1c2a52; z-index: 2; }
    td.n { color: #4f5f88; }
    td.has { background: var(--cell); font-weight: 600; }
    td.many { background: var(--cell-hi); }
    td.total { font-weight: 700; color: var(--accent); }
    tr.unused td:first-child { color: var(--zero); }
    tr.unused td.total { color: var(--zero); }
    .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: #2a3a66; color: var(--muted); margin-left: 6px; }
    .tag.red { background: #5a2330; color: #ffb3b3; }
    code { background: #22305a; padding: 1px 5px; border-radius: 4px; }
    .err { background: #5a2330; padding: 12px 16px; border-radius: 10px; }
    .boss td.b { color: var(--boss); font-weight: 600; }
</style>
</head>
<body>
<main>
    <h1>Adventure Penguin · inimigos por fase</h1>
    <p class="sub">Lido direto de <code>levels.js</code>: recarregue a página para atualizar.</p>
    <div id="app"></div>
</main>

<script src="levels.js"></script>
<script>
(function () {
    // letra do mapa -> nome (mesma tabela do jogo)
    const ENEMIES = [
        ['e', 'Bola de neve'], ['u', 'Ouriço'], ['r', 'Rena'], ['p', 'Pinha explosiva'],
        ['n', 'Bola de neve gigante'], ['y', 'Urso polar'], ['f', 'Foca'], ['a', 'Coruja'],
        ['b', 'Boi-almiscarado'], ['m', 'Rato das neves'], ['k', 'Castor'], ['v', 'Morcego'], ['l', 'Alce'], ['h', 'Narval'], ['j', 'Urso da guarda real'], ['g', 'Foca guarda-costas'], ['q', 'Coruja mensageira real'], ['t', 'Ouriço da guarda'], ['x', 'Alce real'],
    ];
    const BOSSES = { king: 'Rei do Gelo', snowman: 'Boneco de Neve', snowflake: 'Floco de Neve', yeti: 'Yeti', mammoth: 'Mamute', king2: 'Rei do Gelo (revanche)' };
    const app = document.getElementById('app');
    if (typeof LEVELS === 'undefined') { app.innerHTML = '<p class="err">Não consegui ler <code>levels.js</code>. Abra este arquivo de dentro da pasta <code>Js/JsAdventurePenguin</code>.</p>'; return; }

    const count = (map, ch) => map.join('').split(ch).length - 1;
    const levels = LEVELS.filter(l => !l.boss);
    const world = name => name.split('-')[0];

    // ---------- inimigos x fases ----------
    let head = '<tr><th>Inimigo</th>';
    levels.forEach((l, i) => { const w = i > 0 && world(levels[i - 1].name) !== world(l.name); head += `<th class="${w ? 'world' : ''}">${l.name}</th>`; });
    head += '<th>Total</th><th>Fases</th></tr>';
    let unused = 0, body = '';
    for (const [ch, name] of ENEMIES) {
        const nums = levels.map(l => count(l.map, ch));
        const total = nums.reduce((a, b) => a + b, 0), used = nums.filter(Boolean).length;
        if (!total) unused++;
        body += `<tr class="${total ? '' : 'unused'}"><td>${name} <code>${ch}</code>${!total ? '<span class="tag red">não usado</span>' : used === 1 ? '<span class="tag">só 1 fase</span>' : ''}</td>`;
        nums.forEach((n, i) => { const w = i > 0 && world(levels[i - 1].name) !== world(levels[i].name); body += `<td class="${n ? (n >= 6 ? 'has many' : 'has') : 'n'}" style="${w ? 'border-left:2px solid var(--accent)' : ''}">${n || '·'}</td>`; });
        body += `<td class="total">${total}</td><td>${used}</td></tr>`;
    }

    // ---------- resumo por fase ----------
    let sum = '<tr><th>Fase</th><th>Inimigos</th><th>Moedas</th><th>Peixe dourado</th><th>Peixe verde</th><th>Ponto de controle</th><th>Cenário</th></tr>';
    for (const l of levels) {
        const en = ENEMIES.reduce((t, [ch]) => t + count(l.map, ch), 0);
        const coins = count(l.map, 'o') + count(l.map, '$');
        sum += `<tr><td>${l.name}</td><td>${en}</td><td class="${coins === 80 ? '' : 'total'}">${coins}</td><td>${count(l.map, 'F')}</td><td>${count(l.map, 'V')}</td><td>${count(l.map, 'K') ? 'sim' : '—'}</td><td>${l.cenario || 'floresta'}</td></tr>`;
    }

    // ---------- chefes ----------
    let boss = '<tr><th>Chefe</th><th>Onde</th></tr>';
    LEVELS.forEach((l, i) => { if (l.boss) boss += `<tr class="boss"><td class="b">${BOSSES[l.boss] || l.boss}</td><td>${l.name === 'REI' ? 'depois da ' + LEVELS[i - 1].name : l.name}</td></tr>`; });

    const used = ENEMIES.length - unused;
    app.innerHTML = `
        <div class="cards">
            <div class="card"><b>${levels.length}</b><span>fases</span></div>
            <div class="card"><b>${LEVELS.length - levels.length}</b><span>chefes</span></div>
            <div class="card"><b>${used}/${ENEMIES.length}</b><span>inimigos em uso</span></div>
            <div class="card ${unused ? 'alert' : ''}"><b>${unused}</b><span>sem uso</span></div>
        </div>
        <h2>Inimigos por fase</h2>
        <div class="scroll"><table>${head}${body}</table></div>
        <h2>Resumo das fases</h2>
        <div class="scroll"><table>${sum}</table></div>
        <h2>Chefes</h2>
        <div class="scroll"><table>${boss}</table></div>`;
})();
</script>
</body>
</html>
